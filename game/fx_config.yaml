# Сквозные параметры визуальных эффектов проекта.
# Правка вживую: FX Tuner (F10 в dev-сборке) → «Сохранить».
# Читается при запуске игры; число вне диапазона прижимается к границе,
# значение чужого типа заменяется дефолтом из кода (fx_param).

noise:  # Зерно
  enabled: true   # включить зерно
  strength: 0.11  # сила зерна поверх всей игры · 0.0..1.0
  steps: 24       # ступеней серого в зерне; 0 — без постеризации, от 2 — ступени · 0..32

posterize:  # Постеризация
  enabled: true  # включить постеризацию
  scope: scene   # scene — сцена без UI, screen — весь экран с UI
  steps: 26      # уровней на канал · 2..32
  mix: 0.63      # сила: смешивание с оригиналом · 0.0..1.0
  gamma: 1.05    # больше 1 — больше ступеней в тенях; 1 — как в Unity · 0.25..4.0
  relax: 0.805   # плавность смены fx_posterize_strength · 0.005..1.0

pixelate:  # Пикселизация
  enabled: false  # включить пикселизацию
  scope: scene    # scene — сцена без UI, screen — весь экран с UI
  size: 4         # размер пикселя в точках экрана 1920×1080 · 2..64
  relax: 0.44     # плавность смены fx_pixelate_strength · 0.005..1.0

grade:  # Ретушь
  enabled: true      # включить ретушь
  scope: scene       # scene — сцена без UI, screen — весь экран с UI
  brightness: -0.03  # яркость: сдвиг, 0 — без изменений · -0.5..0.5
  contrast: 0.96     # контраст: 1 — без изменений · 0.0..2.0
  saturation: 0.86   # насыщенность: 0 — ч/б, 1 — без изменений · 0.0..2.0

chroma:  # Хроматическая аберрация
  enabled: true  # включить хроматическую аберрацию
  scope: scene   # scene — сцена без UI, screen — весь экран с UI
  red: 0.006     # смещение красного от центра; 0 — на месте · -0.05..0.05
  green: 0.004   # смещение зелёного от центра · -0.05..0.05
  blue: 0.004    # смещение синего от центра · -0.05..0.05
  relax: 0.6     # плавность смены fx_chroma_strength · 0.005..1.0

bloom:  # Bloom
  enabled: true    # включить свечение ярких мест
  scope: scene     # scene — сцена без UI, screen — весь экран с UI
  threshold: 0.51  # порог яркости, выше которого светится · 0.0..1.0
  knee: 0.43       # мягкость порога: 0 — резкая граница · 0.0..1.0
  intensity: 1.0   # сила свечения · 0.0..3.0
  radius: 24       # радиус свечения в точках экрана 1920×1080 · 4..128

cursor:  # Курсор
  enabled: true    # включить процарапанный штрих
  mix: 0.24        # сила штриха: 0 — исходник, 1 — полный · 0.0..1.0
  idle_mix: 1.0    # сила без наведения, доля от силы при наведении · 0.0..1.0
  amp: 3.1         # дрожание контура, px; при наведении +50% · 0.0..10.0
  jitter_x: 0.02   # частота шума дрожания по X, 1/px · 0.0..2.0
  jitter_y: 0.6    # частота шума дрожания по Y, 1/px · 0.0..2.0
  fiber_x: 1.0     # частота шума волокон по X, 1/px · 0.0..2.0
  fiber_y: 0.05    # частота шума волокон по Y, 1/px · 0.0..2.0
  fiber_cut: 0.0   # порог волокон: выше — больше разрывов · 0.0..1.0
  copies: 1        # обводок: основная + копии · 1..3
  spread: 0.0      # множитель смещения копий · 0.0..5.0
  copy_alpha: 0.0  # альфа копий · 0.0..1.0
  animate: true    # перерисовывать штрих ступеньками
  step: 0.15       # шаг перерисовки, с · 0.05..0.5

scene_choice_text:  # Текст кнопок в сценах
  enabled: true     # включить процарапанный штрих
  mix: 0.6          # сила штриха: 0 — исходник, 1 — полный · 0.0..1.0
  idle_mix: 0.78    # сила без наведения, доля от силы при наведении · 0.0..1.0
  amp: 0.7          # дрожание контура, px; при наведении +50% · 0.0..10.0
  jitter_x: 0.525   # частота шума дрожания по X, 1/px · 0.0..2.0
  jitter_y: 0.38    # частота шума дрожания по Y, 1/px · 0.0..2.0
  fiber_x: 0.705    # частота шума волокон по X, 1/px · 0.0..2.0
  fiber_y: 0.525    # частота шума волокон по Y, 1/px · 0.0..2.0
  fiber_cut: 0.19   # порог волокон: выше — больше разрывов · 0.0..1.0
  copies: 3         # обводок: основная + копии · 1..3
  spread: 0.0       # множитель смещения копий · 0.0..5.0
  copy_alpha: 0.88  # альфа копий · 0.0..1.0
  animate: true     # перерисовывать штрих ступеньками
  step: 0.25        # шаг перерисовки, с · 0.05..0.5

parallax:  # Параллакс
  amp: 8       # сдвиг слоя master при мыши у края экрана, px · 0..60
  near: 5      # добавка ближнего плана к сдвигу слоя, px · 0..60
  smooth: 0.1  # доля пути за кадр 60 Гц; меньше — плавнее · 0.005..1.0

rift:  # Разлом (сценовые кнопки)
  enabled: true          # включить разлом под сценовыми кнопками
  idle: 0.05             # сила без наведения · 0.0..1.0
  hover: 0.65            # сила при наведении · 0.0..1.0
  scale: 0.65            # размер пятна относительно кнопки · 0.3..3.0
  soft: 0.85             # мягкость края пятна · 0.05..1.0
  amp: 4.0               # размах ряби, px · 0.0..40.0
  freq: 7.0              # частота ряби по пятну · 1.0..40.0
  speed: 0.9             # скорость ряби · 0.0..5.0
  rgb: 6.5               # расслоение каналов к краю пятна, px · 0.0..30.0
  tear: 1.5              # сдвиг рваных строк, px · 0.0..60.0
  tear_rate: 1.0         # доля рваных строк · 0.0..1.0
  glow: 0.82             # свечение под текстом: сила, 0 — нет · 0.0..1.0
  glow_size: 1.08        # свечение: размер овала относительно кнопки · 0.3..3.0
  glow_soft: 0.69        # свечение: мягкость края · 0.05..1.0
  glow_core: 1.55        # свечение: плотность ядра, больше — уже · 0.1..5.0
  glow_color: "#000000"  # свечение: цвет
  glow_breath_t: 0.6     # свечение: моргание, половина цикла, с · 0.1..5.0
  glow_grow: 1.05        # свечение: раздувание на вдохе; 1 — без · 1.0..1.5
  glow_low: 0.94         # свечение: яркость на выдохе; 1 — не моргает · 0.0..1.0
  fade: 0.3              # появление, исчезание и смена силы при наведении, с · 0.0..2.0
  relax: 0.525           # не используется кодом

show_text:  # Текст на экране (show text)
  enabled: true     # включить процарапанный штрих
  mix: 0.44         # сила штриха: 0 — исходник, 1 — полный · 0.0..1.0
  idle_mix: 1.0     # сила без наведения, доля от силы при наведении · 0.0..1.0
  amp: 3.1          # дрожание контура, px; при наведении +50% · 0.0..10.0
  jitter_x: 0.61    # частота шума дрожания по X, 1/px · 0.0..2.0
  jitter_y: 0.6     # частота шума дрожания по Y, 1/px · 0.0..2.0
  fiber_x: 0.655    # частота шума волокон по X, 1/px · 0.0..2.0
  fiber_y: 0.655    # частота шума волокон по Y, 1/px · 0.0..2.0
  fiber_cut: 0.3    # порог волокон: выше — больше разрывов · 0.0..1.0
  copies: 3         # обводок: основная + копии · 1..3
  spread: 1.0       # множитель смещения копий · 0.0..5.0
  copy_alpha: 0.24  # альфа копий · 0.0..1.0
  animate: true     # перерисовывать штрих ступеньками
  step: 0.15        # шаг перерисовки, с · 0.05..0.5

vignette:  # Виньетка
  enabled: true       # разрешить виньетку; включает сцена через fx_vignette
  strength: 0.74      # плотность затемнения у краёв · 0.0..1.0
  radius: 0.44        # радиус чистого центра, доля полудиагонали · 0.0..1.5
  softness: 0.49      # ширина перехода к краю · 0.01..1.5
  breath_amp: 0.115   # дыхание: размах радиуса · 0.0..0.5
  breath_period: 8.9  # период дыхания, с · 0.5..20.0
  fade: 1.0           # проявление и угасание при смене fx_vignette, с · 0.0..5.0

